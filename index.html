<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デリログ</title>
  <style>

    :root{
      --green:#21a85b;
      --green2:#34b768;
      --blue:#1f6fea;
      --red:#ff2b35;
      --ink:#111827;
      --muted:#6b7280;
      --line:#edf0f3;
      --card:#ffffff;
      --bg:#f7f8f7;
      --shadow:0 14px 38px rgba(31,41,55,.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body{min-height:100%;}
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(34,197,94,.08), transparent 28%),
        linear-gradient(180deg,#fbfbfb 0%,#f3f5f4 100%);
      color: var(--ink);
    }
    .app {
      max-width: 392px;
      margin: 14px auto;
      padding: 18px 16px 20px;
      background: rgba(255,255,255,.92);
      border: 1px solid #e8ecef;
      border-radius: 22px;
      box-shadow: var(--shadow);
      min-height: calc(100vh - 28px);
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      background:
        radial-gradient(circle at 75% 25%, rgba(255,255,255,.34), transparent 24%),
        linear-gradient(145deg, #24c66c 0%, #159447 58%, #0f6f39 100%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 22px rgba(21,148,71,.24), inset 0 1px 0 rgba(255,255,255,.34);
      flex-shrink:0;
      overflow: hidden;
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.88);
      border-left-color: transparent;
      border-radius: 50%;
      transform: rotate(-26deg);
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      right: 9px;
      bottom: 9px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: -13px -8px 0 rgba(255,255,255,.82);
    }
    .brand-letter {
      position: relative;
      z-index: 1;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      transform: translateX(-1px);
    }
    .brand-title { min-width:0; }
    .header h1 { font-size: 22px; font-weight: 900; letter-spacing: .04em; color: #0b1220; line-height:1.05; }
    .subtitle { font-size: 11px; color: #8a95a3; margin-top: 4px; letter-spacing: .02em; white-space: nowrap; }
    .header-btns { display: flex; align-items:center; gap: 14px; flex-shrink:0; }
    .hbtn {
      background: #fff;
      border: 1px solid #e9edf1;
      border-radius: 999px;
      width: 34px;
      height: 34px;
      padding: 0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size: 0;
      color: #111827;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(17,24,39,.05);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .hbtn:hover { background: #f8faf9; transform: translateY(-1px); }
    .hbtn.add {
      width: 38px;
      height: 38px;
      color: var(--green);
      border-color: #22c55e;
      box-shadow: 0 5px 14px rgba(34,197,94,.12);
    }
    .hbtn.add::before{content:"+";font-size:32px;line-height:1;font-weight:300;margin-top:-3px;}
    .hbtn.mail::before{content:"✉";font-size:20px;line-height:1;}
    .hbtn.settings::before{content:"⚙";font-size:20px;line-height:1;}
    .sync-bar {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: #4b5563; margin-bottom: 14px;
      padding: 11px 12px; background: #fff; border-radius: 10px;
      border: 1px solid #eff2f4; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
    }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; display: inline-block; vertical-align: -1px; }
    .sync-dot.ok { background: #22c55e; }
    .sync-dot.err { background: #ef4444; }
    .sync-dot.ing { background: #f59e0b; animation: blink2 1s infinite; }
    .sync-dot.none { background: #aaa; }
    @keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .tab-bar {
      display: flex; gap: 0; margin-bottom: 14px; background: #fff;
      border-radius: 9px; padding: 0; border: 1px solid #e9edf1; overflow:hidden;
      box-shadow: 0 4px 12px rgba(17,24,39,.03);
    }
    .tab {
      flex: 1; text-align: center; padding: 12px 6px; font-size: 13px;
      cursor: pointer; color: #4b5563; font-weight: 700; border-radius: 0;
      transition: background .14s ease, color .14s ease;
    }
    .tab.active {
      background: linear-gradient(180deg,var(--green2),var(--green));
      color: white; font-weight: 800; border: none; box-shadow: 0 8px 18px rgba(34,197,94,.22);
    }
    .date-label { font-size: 13px; color: #4b5563; margin-bottom: 14px; text-align: center; font-weight: 600; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .stat {
      background: #fff; border-radius: 15px; padding: 15px 14px 16px;
      border:1px solid #edf0f3; min-height:96px; box-shadow: 0 9px 22px rgba(17,24,39,.04);
      position:relative; overflow:hidden;
    }
    .stat-label { font-size: 13px; color: #374151; margin-bottom: 10px; font-weight: 700; }
    .stat-value { font-size: 30px; font-weight: 800; color: #111827; letter-spacing:-.02em; }
    .stat:first-child .stat-value{color:var(--green);}
    .stat-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .progress-wrap { margin: 8px 0 20px; }
    .progress-bar { height: 4px; background: #d7dadd; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; transition: width 0.3s, background 0.3s; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #4b5563; margin-top: 10px; }
    .active-card {
      border: 1px solid #def3e7; border-radius: 16px; padding: 14px; margin-bottom: 18px; background: #f7fff9;
      box-shadow: 0 8px 18px rgba(34,197,94,.06);
    }
    .active-row { display: flex; align-items: center; justify-content: space-between; gap:10px; }
    .active-left { display: flex; align-items: center; gap: 10px; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .active-name { font-size: 14px; font-weight: 800; color: #111; }
    .active-since { font-size: 11px; color: #667085; }
    .active-time { font-size: 20px; font-weight: 800; color: #111; }
    .done-btn { background: #22c55e; color: white; border: none; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .done-btn:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
    .sec-label { font-size: 13px; color: #111827; margin: 14px 2px 9px; font-weight: 800; }
    .vendors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 8px 0 26px; }
    .vbtn {
      border: 1px solid #e5e9ed; border-radius: 999px; aspect-ratio: 1 / 1;
      padding: 13px 4px; text-align: center; cursor: pointer; background: #fff;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      box-shadow: 0 9px 20px rgba(17,24,39,.04);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .vbtn:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 12px 26px rgba(17,24,39,.07); }
    .vbtn.disabled { opacity: 0.55; pointer-events: none; }
    .vbtn.active-uber { border: 2px solid var(--green); }
    .vbtn.active-demae { border: 2px solid var(--red); }
    .vbtn.active-rocket { border: 2px solid var(--blue); }
    .vicon { font-size: 28px; margin-bottom: 6px; line-height:1; }
    #vbtn-uber .vicon{filter:hue-rotate(70deg) saturate(1.4);}
    .vname { font-size: 12px; font-weight: 800; color: #111827; }
    .vtime { font-size: 12px; color: var(--green); margin-top: 6px; font-weight:700; }
    #vbtn-demae .vtime{color:var(--red);}
    #vbtn-rocket .vtime{color:var(--blue);}
    .hitem { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f0f0f0; }
    .hitem:last-child { border-bottom: none; }
    .hdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .hvendor { font-size: 13px; color: #333; font-weight:700; }
    .hrange { font-size: 11px; color: #888; }
    .hdur { font-size: 12px; font-weight: 700; color: #333; }
    .edit-btn, .del-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 12px; padding: 0 3px; }
    .edit-btn:hover { color: #2563eb; }
    .del-btn:hover { color: #ef4444; }
    .empty {
      text-align: center; padding: 29px 12px; font-size: 13px; color: #6b7280;
      background:#fff; border-radius:16px; border:1px solid #f0f2f4; box-shadow:0 10px 24px rgba(17,24,39,.03);
    }
    .empty::before{content:"▤";font-size:22px;color:#374151;margin-right:10px;vertical-align:-3px;}
    .modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding:20px; }
    .modal { background: white; border-radius: 18px; padding: 1.25rem; width: 310px; border: 1px solid #ddd; box-shadow: var(--shadow); }
    .modal-title { font-size: 16px; font-weight: 800; color: #111; margin-bottom: 1rem; }
    .form-row { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: #667085; margin-bottom: 5px; font-weight:700; }
    .form-row select, .form-row input, #today-earnings input {
      font-size: 15px; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: white; color: #111827; outline:none;
    }
    .form-row select, .form-row input{width:100%;}
    .form-row select:focus, .form-row input:focus, #today-earnings input:focus{border-color:#86efac; box-shadow:0 0 0 3px rgba(34,197,94,.12);}
    .form-btns { display: flex; gap: 8px; margin-top: 1rem; }
    .btn-cancel { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 10px; background: none; color: #667085; font-size: 13px; font-weight:700; cursor: pointer; }
    .btn-save { flex: 1; padding: 10px; border: none; border-radius: 10px; background: #22c55e; color: white; font-size: 13px; font-weight: 800; cursor: pointer; }
    .settings-panel { border: 1px solid #e5e9ed; border-radius: 16px; padding: 1rem; margin-bottom: 1.25rem; background: #fff; box-shadow:0 8px 20px rgba(17,24,39,.03); }
    .settings-title { font-size: 14px; font-weight: 800; color: #111; margin-bottom: 12px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-name { font-size: 12px; color: #555; font-weight:700; }
    .setting-row select, .setting-row input { font-size: 12px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 8px; background: white; color: #333; }
    .setting-row input[type=number] { width: 60px; text-align: right; }
    .setting-row input[type=email], .setting-row input[type=url] { font-size: 11px; width: 100%; }
    .week-nav{display:flex;justify-content:center;gap:8px;margin:-2px 0 14px;}
    .week-nav-btn{min-width:72px;height:36px;padding:0 12px;border:1px solid #e4e8ec;border-radius:999px;background:#fff;color:#374151;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 6px 16px rgba(17,24,39,.05);transition:transform .12s ease, background .12s ease, border-color .12s ease;}
    .week-nav-btn:hover{background:#f8faf9;transform:translateY(-1px);border-color:#d9dee4;}
    .week-nav-btn.current{background:#f3fff7;border-color:#bde9cd;color:var(--green);box-shadow:0 7px 18px rgba(34,197,94,.09);}
    .nav-arrow{font-size:18px;line-height:1;margin-top:-1px;}
    .week-title { font-size: 14px; font-weight: 800; color: #111; margin-bottom: 8px; }
    .week-vendor-row {
      display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #edf0f3; font-size: 13px;
    }
    .week-total-row {
      display: flex; justify-content: space-between; padding: 12px 0 4px; font-size: 15px; font-weight: 800; color: #111; border-top: 1px solid #e5e7eb; margin-top: 4px;
    }
    .week-total-row span:last-child{color:#159447;}
    .day-group { margin-bottom: 14px; }
    .day-label { font-size: 13px; font-weight: 800; color: #667085; margin-bottom: 6px; }
    .manual-tag { font-size: 9px; background: #fef3c7; color: #d97706; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
    .gas-tag { font-size: 9px; background: #dcfce7; color: #16a34a; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
    #today-earnings{background:#fff;border-radius:0;padding:0;margin-bottom:14px;}
    @media (max-width:430px){
      .app{margin:8px;max-width:none;border-radius:20px;padding:17px 15px 20px;}
      .header h1{font-size:20px;}
      .subtitle{font-size:10px;}
      .brand-mark{width:34px;height:34px;border-radius:11px;}
      .header-btns{gap:11px;}
      .vendors{gap:12px;}
    }

  </style>

  <style>
    /* ===== スマホ向けコンパクト調整 ===== */
    .app { margin: 8px auto; padding: 14px 14px 16px; border-radius: 20px; min-height: calc(100vh - 16px); }
    .header { margin-bottom: 10px; }
    .header h1 { font-size: 19px; }
    .subtitle { font-size: 10px; margin-top: 3px; }
    .brand { gap: 8px; }
    .brand-mark { width: 32px; height: 32px; border-radius: 10px; font-size: 16px; }
    .header-btns { gap: 9px; }
    .hbtn { width: 31px; height: 31px; }
    .hbtn.add { width: 35px; height: 35px; }
    .hbtn.add::before { font-size: 29px; }
    .hbtn.mail::before, .hbtn.settings::before { font-size: 18px; }
    .sync-bar { margin-bottom: 9px; padding: 8px 10px; font-size: 11.5px; border-radius: 9px; }
    .tab-bar { margin-bottom: 9px; border-radius: 9px; }
    .tab { padding: 10px 6px; font-size: 13px; }
    .week-nav{gap:7px;margin:-1px 0 12px;}
    .week-nav-btn{height:34px;min-width:68px;font-size:12.5px;padding:0 10px;}
    .date-label { margin-bottom: 9px; font-size: 12.5px; }
    .stats { gap: 9px; margin-bottom: 10px; }
    .stat { min-height: 78px; padding: 11px 11px 10px; border-radius: 14px; }
    .stat-label { font-size: 12.5px; margin-bottom: 6px; }
    .stat-value { font-size: 27px; line-height: 1.05; }
    .stat-sub { font-size: 11.5px; margin-top: 4px; }
    .sec-label { margin: 10px 2px 6px; font-size: 12.5px; }
    #today-earnings { margin-bottom: 8px !important; }
    #today-earnings .week-vendor-row { padding: 5px 0 !important; min-height: 34px; font-size: 12.5px; }
    #today-earnings input { height: 30px; padding: 5px 8px; font-size: 14px; border-radius: 8px; }
    #today-earnings input[style*="width:140px"] { width: 118px !important; }
    #today-earnings input[style*="width:82px"] { width: 64px !important; }
    #today-earnings .week-total-row { padding: 8px 0 2px !important; font-size: 14px; }
    .progress-wrap { margin: 5px 0 10px; }
    .progress-label { margin-top: 6px; font-size: 11.5px; }
    .active-card { padding: 10px 11px; margin-bottom: 10px; border-radius: 14px; }
    .active-time { font-size: 18px; }
    .done-btn { padding: 7px 12px; font-size: 12.5px; }
    .vendors { gap: 10px; margin: 6px 0 14px; }
    .vbtn { aspect-ratio: auto; height: 82px; border-radius: 24px; padding: 8px 3px; }
    .vicon { font-size: 24px; margin-bottom: 4px; }
    .vname { font-size: 11.5px; line-height: 1.2; }
    .vtime { font-size: 11.5px; margin-top: 4px; }
    .empty { padding: 18px 10px; border-radius: 14px; font-size: 12.5px; }
    .empty::before { font-size: 19px; margin-right: 8px; }
    @media (max-width:430px){ .app{margin:6px;max-width:none;border-radius:18px;padding:13px 13px 15px;} .header h1{font-size:19px;} .subtitle{font-size:10px;} .brand-mark{width:31px;height:31px;border-radius:10px;font-size:15px;} .header-btns{gap:8px;} .vendors{gap:9px;} }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span class="brand-letter">D</span></div>
      <div class="brand-title">
        <h1>デリログ</h1>
        <div class="subtitle">フードデリバリー稼働管理</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="hbtn add" onclick="openModal(null)" title="追加" aria-label="追加"></button>
      <button class="hbtn mail" onclick="openMailModal()" title="メール" aria-label="メール"></button>
      <button class="hbtn settings" onclick="toggleSettings()" title="設定" aria-label="設定"></button>
    </div>
  </div>

  <div id="sync-bar" class="sync-bar">
    <span><span class="sync-dot none" id="sync-dot"></span><span id="sync-msg">GAS URL未設定（ローカル保存中）</span></span>
    <button onclick="syncFromGAS()" style="background:none;border:none;font-size:12px;color:#16a34a;font-weight:700;cursor:pointer;">更新</button>
  </div>

  <div id="settings-panel" style="display:none;">
    <div class="settings-panel">
      <div class="settings-title">設定</div>
      <div class="setting-row">
        <span class="setting-name">週の開始曜日</span>
        <select id="week-start" onchange="saveSettings()">
          <option value="0">日曜始まり</option>
          <option value="1" selected>月曜始まり</option>
          <option value="2">火曜始まり</option>
          <option value="3">水曜始まり</option>
          <option value="4">木曜始まり</option>
          <option value="5">金曜始まり</option>
          <option value="6">土曜始まり</option>
        </select>
      </div>
      <div class="setting-row">
        <span class="setting-name">週の上限時間</span>
        <input type="number" id="week-max" value="20" min="1" max="40" onchange="saveSettings()"> h
      </div>
      <div class="setting-row">
        <span class="setting-name">送信先メール</span>
        <input type="email" id="mail-to" placeholder="you@example.com" onchange="saveSettings()">
      </div>
      <div class="setting-row" style="flex-direction:column;align-items:flex-start;">
        <span class="setting-name">GAS URL（省略可）</span>
        <input type="url" id="gas-url" placeholder="https://script.google.com/..." onchange="saveSettings()">
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" id="tab-today" onclick="switchTab('today')">今日</div>
    <div class="tab" id="tab-week" onclick="switchTab('week')">今週</div>
    <div class="tab" id="tab-all" onclick="switchTab('all')">全記録</div>
  </div>

  <div id="view-today">
    <div class="date-label" id="date-label"></div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">今日の稼働</div>
        <div class="stat-value" id="today-val">0:00</div>
        <div class="stat-sub" id="today-sub">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">今週の残り</div>
        <div class="stat-value" id="week-remain">20:00</div>
        <div class="stat-sub" id="week-sub">今週 0:00 使用</div>
      </div>
    </div>
  <div class="sec-label">今日の売上（4:00締め）</div>
  <div id="today-earnings" style="margin-bottom:1rem;"></div>
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="prog-fill" style="width:0%;background:#22c55e;"></div>
      </div>
      <div class="progress-label">
        <span id="week-range-label"></span>
        <span id="prog-pct">0%</span>
      </div>
    </div>
    <div id="active-area"></div>
    <div class="sec-label">業者を選んで開始</div>
    <div class="vendors">
      <div class="vbtn" id="vbtn-uber" onclick="startDel('uber')">
        <div class="vicon">🚴</div>
        <div class="vname">Uber Eats</div>
        <div class="vtime" id="vt-uber">0:00</div>
      </div>
      <div class="vbtn" id="vbtn-demae" onclick="startDel('demae')">
        <div class="vicon">🛵</div>
        <div class="vname">出前館</div>
        <div class="vtime" id="vt-demae">0:00</div>
      </div>
      <div class="vbtn" id="vbtn-rocket" onclick="startDel('rocket')">
        <div class="vicon">🚀</div>
        <div class="vname">ロケットナウ</div>
        <div class="vtime" id="vt-rocket">0:00</div>
      </div>
    </div>
    <div class="sec-label">本日の記録</div>
    <div id="hist-today"></div>
  </div>

  <div id="view-week" style="display:none;">

<script>
const V = {
  uber:   { name: 'Uber Eats',    color: '#16a34a' },
  demae:  { name: '出前館',       color: '#ff2b35' },
  rocket: { name: 'ロケットナウ', color: '#1f6fea' }
};
const DAYS = ['日','月','火','水','木','金','土'];
const V_NAMES = { 'Uber Eats': 'uber', '出前館': 'demae', 'ロケットナウ': 'rocket' };
const DAY_CUTOFF_HOUR = 4; // 4:00〜翌3:59 を「同じ日」として集計（Uber締め）

// 正しい
let cfg = { weekStart: 1, weekMax: 20, mailTo: '', gasUrl: 'https://script.google.com/macros/s/AKfycbxW8m3QiNOfElKdGygJ5KuflBbWUmEeittVMIHaY0qOnsBNZ7IoaEr0Clq6pfpWSFZO/exec' };
let active = null, activeStart = null;
let records = [];
let completing = false;
let weekOffset = 0; // 0=今週, -1=先週 ...
let currentTab = 'today';
let editIdx = null;
let syncStatus = 'none';
let earnings = {}; // dayKey -> { uber:number, demae:number, rocket:{delivery:number, quest:number} }

function loadData() {
  try {
    const c = localStorage.getItem('fdc_cfg');
    if (c) cfg = Object.assign(cfg, JSON.parse(c));
    if (!cfg.gasUrl || cfg.gasUrl.indexOf('AKfycbwMH') !== -1) cfg.gasUrl = 'https://script.google.com/macros/s/AKfycbxW8m3QiNOfElKdGygJ5KuflBbWUmEeittVMIHaY0qOnsBNZ7IoaEr0Clq6pfpWSFZO/exec';
    const r = localStorage.getItem('fdc_records');
    if (r) records = JSON.parse(r).map(x => ({ ...x, start: new Date(x.start), end: new Date(x.end) }));
    const e = localStorage.getItem('fdc_earnings');
    if (e) earnings = JSON.parse(e) || {};
    const a = localStorage.getItem('fdc_active');
    if (a) { const ad = JSON.parse(a); active = ad.vendor; activeStart = new Date(ad.start); }
    document.getElementById('week-start').value = cfg.weekStart;
    document.getElementById('week-max').value = cfg.weekMax;
    document.getElementById('mail-to').value = cfg.mailTo || '';
    document.getElementById('gas-url').value = cfg.gasUrl || '';
  } catch(e) {}
}

function saveLocalData() {
  try {
    localStorage.setItem('fdc_cfg', JSON.stringify(cfg));
    localStorage.setItem('fdc_records', JSON.stringify(records));
    localStorage.setItem('fdc_earnings', JSON.stringify(earnings));
    if (active) localStorage.setItem('fdc_active', JSON.stringify({ vendor: active, start: activeStart }));
    else localStorage.removeItem('fdc_active');
  } catch(e) {}
}

function saveSettings() {
  cfg.weekStart = parseInt(document.getElementById('week-start').value);
  cfg.weekMax = parseInt(document.getElementById('week-max').value) || 20;
  cfg.mailTo = document.getElementById('mail-to').value;
  cfg.gasUrl = document.getElementById('gas-url').value;

}

function toggleSettings() {

  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

function switchTab(tab) {

    document.getElementById('tab-'+t).className = 'tab'+(t===tab?' active':'');
    document.getElementById('view-'+t).style.display = t===tab?'block':'none';
  });

}

function changeWeek(delta) {

  render();
}
function resetWeek() {
  weekOffset = 0;
  render();
}

function money(n) {
  const x = Math.round(Number(n) || 0);
  return '¥' + x.toLocaleString('ja-JP');
}
function moneyInputValue(n) {
  const x = Math.round(Number(n) || 0);
  return String(x);
}
function safeNum(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function ensureDayEarnings(dayKey) {
  if (!earnings[dayKey]) earnings[dayKey] = {};
  if (typeof earnings[dayKey].uber !== 'number') earnings[dayKey].uber = 0;
  if (typeof earnings[dayKey].demae !== 'number') earnings[dayKey].demae = 0;
  if (!earnings[dayKey].rocket || typeof earnings[dayKey].rocket !== 'object') earnings[dayKey].rocket = {};
  if (typeof earnings[dayKey].rocket.delivery !== 'number') earnings[dayKey].rocket.delivery = 0;
  if (typeof earnings[dayKey].rocket.quest !== 'number') earnings[dayKey].rocket.quest = 0;
  return earnings[dayKey];
}
function setEarning(dayKey, vendor, field, value) {
  const d = ensureDayEarnings(dayKey);
  const v = Math.max(0, Math.round(safeNum(value)));
  if (vendor === 'rocket') {
    d.rocket[field] = v;
  } else {
    d[vendor] = v;
  }
  saveLocalData();
  render();
}

function updateSyncBar() {
  const dot = document.getElementById('sync-dot');
  const msg = document.getElementById('sync-msg');
  if (!cfg.gasUrl) {
    dot.className = 'sync-dot none';
    msg.textContent = 'GAS URL未設定（ローカル保存中）';
  } else if (syncStatus === 'ok') {
    dot.className = 'sync-dot ok';
    msg.textContent = 'Google Sheetsと同期中';
  } else if (syncStatus === 'ing') {
    dot.className = 'sync-dot ing';
    msg.textContent = '同期中...';
  } else if (syncStatus === 'err') {
    dot.className = 'sync-dot err';
    msg.textContent = '同期エラー（ローカル保存中）';
  } else {
    dot.className = 'sync-dot none';
    msg.textContent = 'GAS設定済み（未同期）';
  }
}


async function syncFromGAS() {
  if (!cfg.gasUrl) return;
  syncStatus = 'ing'; updateSyncBar();
  try {
    const jsonp = (url) => new Promise((resolve, reject) => {
      const cb = '__fdc_cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const cleanup = () => {
        try { delete window[cb]; } catch (_) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      const timer = setTimeout(() => { cleanup(); reject(new Error('JSONP timeout')); }, 15000);
      window[cb] = (data) => { clearTimeout(timer); cleanup(); resolve(data); };
      script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error('JSONP error')); };
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + encodeURIComponent(cb);
      document.head.appendChild(script);
    });

    const data = await jsonp(cfg.gasUrl + '?weekStart=' + encodeURIComponent(cfg.weekStart));
    if (data.allLogs) {
      const pad2 = (n) => String(n).padStart(2, '0');
      const normalizeDate = (s) => String(s || '').trim().replace(/\//g, '-');
      const normalizeTime = (s) => {
        const t = String(s || '').trim();
        if (!t) return '';
        const m = t.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (!m) return t;
        return `${pad2(m[1])}:${m[2]}:${pad2(m[3] ?? '0')}`;
      };
      const toIsoWithJstOffset = (dateStr, timeStr) => {
        const d = normalizeDate(dateStr);
        const t = normalizeTime(timeStr);
        if (!d || !t) return null;
        // Always include timezone to avoid iOS/Android/Windows parsing differences.
        return `${d}T${t}+09:00`;
      };
      const parseIsoOrNull = (iso) => {
        if (typeof iso !== 'string' || !iso.includes('T')) return null;
        const dt = new Date(iso);
        return isNaN(dt) ? null : dt;
      };
      const parseMsOrNull = (ms) => {
        if (ms === null || typeof ms === 'undefined' || ms === '') return null;
        const n = Number(ms);
        if (!Number.isFinite(n)) return null;
        const dt = new Date(n);
        return isNaN(dt) ? null : dt;
      };
      const parseGasDateTime = (r, which) => {
        const dtIso = parseIsoOrNull(r?.[`${which}Iso`]) || parseIsoOrNull(r?.[which]);
        if (dtIso) return dtIso;
        const dtMs = parseMsOrNull(r?.[`${which}Ms`]);
        if (dtMs) return dtMs;
        const built = toIsoWithJstOffset(r?.date, r?.[which]);
        if (!built) return null;
        const dt = new Date(built);
        return isNaN(dt) ? null : dt;
      };

      const newRecords = data.allLogs.map(r => {
        const startDt = parseGasDateTime(r, 'start');
        const endDt = parseGasDateTime(r, 'end');
        let start = startDt;
        let end = endDt;
        // duration は数値/文字列どちらでも来るので安全に数値化
        let duration = Number(r.duration);
        if (!Number.isFinite(duration) && typeof r.duration === 'string') {
          const p = parseInt(r.duration, 10);
          if (Number.isFinite(p)) duration = p;
        }
        const vendor = V_NAMES[r.service] || 'uber';

        // 1) start/end が欠けてても startMs/endMs から復元（GASが返す想定）
        if (!start) start = parseMsOrNull(r?.startMs);
        if (!end) end = parseMsOrNull(r?.endMs);

        // 2) 片方だけなら duration で補完
        if (Number.isFinite(duration) && duration > 0) {
          if (start && !end) end = new Date(start.getTime() + duration * 1000);
          if (end && !start) start = new Date(end.getTime() - duration * 1000);
        }

        // 3) 時刻が全滅でも date + duration があれば「00:00開始」として補完して表示できるようにする
        if (!start && !end && Number.isFinite(duration) && duration > 0 && r?.date) {
          const d = normalizeDate(r.date);
          const s0 = new Date(`${d}T00:00:00+09:00`);
          if (!isNaN(s0)) {
            start = s0;
            end = new Date(s0.getTime() + duration * 1000);
          }
        }

        // 3.5) それでも start/end が作れない場合は「00:00の0秒」として表示できるようにする（行落ち防止）
        if (!start && !end && r?.date) {
          const d = normalizeDate(r.date);
          const s0 = new Date(`${d}T00:00:00+09:00`);
          if (!isNaN(s0)) {
            start = s0;
            end = new Date(s0.getTime());
          }
        }

        // 4) duration が無くても start/end から復元（優先）
        if (start && end) {
          const d2 = Math.floor((end - start) / 1000);
          if (Number.isFinite(d2) && d2 >= 0) duration = d2;
        }
        // 5) どうしても duration が作れない場合でも 0 として表示できるようにする
        if (!Number.isFinite(duration) || duration < 0) duration = 0;

        return {
          id: r.id,
          clientId: r.clientId || '',
          vendor,
          start,
          end,
          duration,
          manual: r.manual,
          synced: true,
          pending: false,
          estimated: (!startDt || !endDt)
        };
      }).filter(r =>
        r.start && r.end &&
        !isNaN(r.start) && !isNaN(r.end)
      );

      const keyFor = (r) => {
        const s = r?.start ? new Date(r.start).getTime() : NaN;
        const e = r?.end ? new Date(r.end).getTime() : NaN;
        const v = r?.vendor || '';
        if (!Number.isFinite(s) || !Number.isFinite(e)) return null;
        // start/end をミリ秒丸め（端末やシートの丸め誤差を吸収）
        const s2 = Math.round(s / 1000);
        const e2 = Math.round(e / 1000);
        return `${v}|${s2}|${e2}`;
      };

      const isNearSame = (a, b) => {
        if (!a || !b) return false;
        if ((a.vendor || '') !== (b.vendor || '')) return false;
        const as = a.start ? new Date(a.start).getTime() : NaN;
        const ae = a.end ? new Date(a.end).getTime() : NaN;
        const bs = b.start ? new Date(b.start).getTime() : NaN;
        const be = b.end ? new Date(b.end).getTime() : NaN;
        if (!Number.isFinite(as) || !Number.isFinite(ae) || !Number.isFinite(bs) || !Number.isFinite(be)) return false;
        // 端末差・丸め差を吸収（±2秒）
        return Math.abs(as - bs) <= 2000 && Math.abs(ae - be) <= 2000;
      };

      // clientId が一致するものは「同じ操作から生まれた同一記録」として最優先でマージする
      const incomingByClientId = new Map(newRecords.filter(r => r.clientId).map(r => [String(r.clientId), r]));

      // 重要：pendingを先に削除しない。
      // pendingを残したまま下のループでGAS版に置き換える。
      // 先に消すと、1回目の同期で画面から消えることがある。

      // 端末差や一部行欠損があっても確実に反映できるよう、IDでもマージする
      const incomingById = new Map(newRecords.filter(r => r.id).map(r => [String(r.id), r]));
      const existingById = new Map(records.filter(r => r && r.id).map(r => [String(r.id), r]));
      const incomingByKey = new Map(newRecords.map(r => [keyFor(r), r]).filter(([k]) => k));

      // 既存の未同期(ローカル)は残しつつ、同期済みはincomingで差し替え
      const merged = [];
      for (const r of records) {
        if (!r) continue;
        const cid = r.clientId ? String(r.clientId) : null;
        if (cid && incomingByClientId.has(cid)) {
          merged.push(incomingByClientId.get(cid));
          continue;
        }
        const id = r.id ? String(r.id) : null;
        if (r.synced) {
          if (id && incomingById.has(id)) merged.push(incomingById.get(id));
          // incomingに無い同期済みは消える（Sheetsが正）
        } else {
          // ローカル未同期でも、同一内容がGASに存在するなら置換して二重表示を防ぐ
          const k = keyFor(r);
          const cand = (k && incomingByKey.has(k)) ? incomingByKey.get(k) : null;
          if (cand && isNearSame(r, cand)) merged.push(cand);
          else merged.push(r);
        }
      }
      // incomingにあって、既存に無いものを追加
      for (const r of newRecords) {
        const id = r.id ? String(r.id) : null;
        const cid = r.clientId ? String(r.clientId) : null;
        if (cid && merged.some(m => m && m.clientId && String(m.clientId) === cid)) continue;
        if (!id || !existingById.has(id)) merged.push(r);
      }

      // 最後に重複排除（GAS+ローカルの二重化対策）
      const seen = new Set();
      records = merged.filter(r => {
        const k = (r.clientId ? `cid:${r.clientId}` : (r.id ? `id:${r.id}` : `k:${keyFor(r)}`)) || null;
        if (!k) return true;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });

      // Androidなどでローカル保存の丸め差が出ても確実に二重化を潰すため、さらにゆるいキーで重複排除
      const looseKeyFor = (r) => {
        const s = r?.start ? new Date(r.start).getTime() : NaN;
        const e = r?.end ? new Date(r.end).getTime() : NaN;
        const v = r?.vendor || '';
        if (!Number.isFinite(s) || !Number.isFinite(e)) return null;
        // 5秒単位で丸める（端末/保存形式の差を吸収）
        const s5 = Math.round(s / 5000);
        const e5 = Math.round(e / 5000);
        return `${v}|${s5}|${e5}`;
      };
      const keepBest = (a, b) => {
        // synced(GAS) を優先。両方同じなら id がある方、次に manual を優先
        const as = !!a?.synced, bs = !!b?.synced;
        if (as !== bs) return as ? a : b;
        const ai = !!a?.id, bi = !!b?.id;
        if (ai !== bi) return ai ? a : b;
        const am = !!a?.manual, bm = !!b?.manual;
        if (am !== bm) return am ? a : b;
        return a;
      };
      const mapLoose = new Map(); // key -> { rec, idx }
      const deduped = [];
      for (const r of records) {
        const k = looseKeyFor(r);
        if (!k) { deduped.push(r); continue; }
        const prev = mapLoose.get(k);
        if (!prev) {
          mapLoose.set(k, { rec: r, idx: deduped.length });
          deduped.push(r);
          continue;
        }
        const chosen = keepBest(prev.rec, r);
        if (chosen !== prev.rec) {
          deduped[prev.idx] = chosen;
          mapLoose.set(k, { rec: chosen, idx: prev.idx });
        }
      }
      records = deduped;
      records.sort((a,b) => a.start - b.start);
      saveLocalData();
    }
    syncStatus = 'ok'; updateSyncBar(); render();
  } catch(e) {
    syncStatus = 'err'; updateSyncBar();
  }
}

async function postToGAS(payload) {
  if (!cfg.gasUrl) return false;
  try {
    await fetch(cfg.gasUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    return true;
  } catch(e) { return false; }
}

function getWeekRange(now) {
  const cur = new Date(now);
  // 営業日（4:00締め）に合わせて「その週の開始」の 4:00 を求める
  const shifted = new Date(cur.getTime() - DAY_CUTOFF_HOUR * 3600000);
  shifted.setHours(0, 0, 0, 0);
  const diff = (shifted.getDay() - cfg.weekStart + 7) % 7;
  const start = new Date(shifted);
  start.setDate(shifted.getDate() - diff);
  start.setHours(DAY_CUTOFF_HOUR, 0, 0, 0);
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  end.setMilliseconds(end.getMilliseconds() - 1);
  return { start, end };
}

function getWeekRangeWithOffset(now, offsetWeeks) {
  const { start, end } = getWeekRange(now);
  const s = new Date(start);
  const e = new Date(end);
  s.setDate(s.getDate() + 7 * offsetWeeks);
  e.setDate(e.getDate() + 7 * offsetWeeks);
  return { start: s, end: e };
}

function businessDayKey(d) {
  const dt = new Date(d);
  const shifted = new Date(dt.getTime() - DAY_CUTOFF_HOUR * 3600000);
  return toDateInput(shifted); // yyyy-MM-dd
}
function businessDayLabelFromKey(key) {
  const base = new Date(`${key}T00:00:00`);
  return `${base.getFullYear()}年${base.getMonth()+1}月${base.getDate()}日（${DAYS[base.getDay()]}）`;
}
function businessDayLabelShortFromKey(key) {
  const base = new Date(`${key}T00:00:00`);
  return dateStr(base);
}

function fmt(sec) {
  const h=Math.floor(Math.abs(sec)/3600), m=Math.floor((Math.abs(sec)%3600)/60);
  return h+':'+String(m).padStart(2,'0');
}
function fmtFull(sec) {
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function tStr(d) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dateStr(d) { return (d.getMonth()+1)+'/'+d.getDate()+'('+DAYS[d.getDay()]+')'; }
function toDateInput(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toTimeInput(d) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function openModal(idx) {
  editIdx = idx;
  const now = new Date();
  document.getElementById('modal-title').textContent = idx===null?'記録を追加':'記録を編集';
  if (idx !== null) {
    const r = records[idx];
    document.getElementById('f-vendor').value = r.vendor;
    document.getElementById('f-date').value = toDateInput(r.start);
    document.getElementById('f-start').value = toTimeInput(r.start);
    document.getElementById('f-end').value = toTimeInput(r.end);
  } else {
    document.getElementById('f-vendor').value = 'uber';
    document.getElementById('f-date').value = toDateInput(now);
    document.getElementById('f-start').value = toTimeInput(now);
    document.getElementById('f-end').value = toTimeInput(now);
  }
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  editIdx = null;
}

async function saveRecord() {
  const vendor = document.getElementById('f-vendor').value;
  const date = document.getElementById('f-date').value;
  const startT = document.getElementById('f-start').value;
  const endT = document.getElementById('f-end').value;
  if (!date||!startT||!endT) { alert('すべての項目を入力してください'); return; }
  const start = new Date(date+'T'+startT);
  const end = new Date(date+'T'+endT);
  if (end<=start) { alert('終了時刻は開始時刻より後にしてください'); return; }
  const duration = Math.floor((end-start)/1000);

  if (editIdx !== null) {
    const oldRec = records[editIdx];
    const clientId = oldRec.clientId || ('manual-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    records[editIdx] = { ...oldRec, clientId, vendor, start, end, duration, manual: true, pending: !!cfg.gasUrl && !oldRec.id };
    if (cfg.gasUrl && oldRec.id) {
      await postToGAS({ action:'update', id:oldRec.id, clientId, service:V[vendor].name, start:start.toISOString(), end:end.toISOString(), manual:true });
      setTimeout(syncFromGAS, 1500);
    } else if (cfg.gasUrl) {
      await postToGAS({ clientId, service:V[vendor].name, start:start.toISOString(), end:end.toISOString(), manual:true });
      setTimeout(syncFromGAS, 1500);
    }
  } else {
    const clientId = 'manual-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    records.push({ clientId, vendor, start, end, duration, manual: true, pending: !!cfg.gasUrl });
    records.sort((a,b) => a.start-b.start);
    if (cfg.gasUrl) {
      await postToGAS({ clientId, service:V[vendor].name, start:start.toISOString(), end:end.toISOString(), manual:true });
      setTimeout(syncFromGAS, 1500);
    }
  }
  saveLocalData(); closeModal(); render();
}

function startDel(v) {
  if (completing) return;
  if (active) return; // 稼働中は誤操作防止（完了ボタンで終了）
  active = v; activeStart = new Date();
  ['uber','demae','rocket'].forEach(x => document.getElementById('vbtn-'+x).className='vbtn');
  document.getElementById('vbtn-'+v).className='vbtn active-'+v;
  saveLocalData(); render();
}

async function completeDel() {
  if (!active || !activeStart) return;
  if (completing) return;
  completing = true;
  const btn = document.getElementById('done-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '保存中...';
  }
  try {
    const end = new Date();
    const clientId = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    const currentVendor = active;
    const rec = {
      clientId,
      vendor: currentVendor,
      start: new Date(activeStart),
      end,
      duration: Math.floor((end - activeStart) / 1000),
      pending: !!cfg.gasUrl
    };

    records.push(rec);
    records.sort((a,b) => a.start-b.start);

    if (cfg.gasUrl) {
      await postToGAS({
        clientId,
        service: V[currentVendor].name,
        start: rec.start.toISOString(),
        end: end.toISOString()
      });
      setTimeout(syncFromGAS, 1500);
    }

    ['uber','demae','rocket'].forEach(x => document.getElementById('vbtn-'+x).className='vbtn');
    active = null; activeStart = null;
    saveLocalData(); render();
  } finally {
    completing = false;
  }
}

async function deleteRecord(idx) {
  if (!confirm('この記録を削除しますか？')) return;
  const rec = records[idx];
  if (cfg.gasUrl && rec.id) {
    await postToGAS({ action:'delete', id:rec.id });
    setTimeout(syncFromGAS, 1500);
  }
  records.splice(idx, 1);
  saveLocalData(); render();
}

function openMailModal() {
  const now = new Date();
  const sel = document.getElementById('mail-week-select');
  sel.innerHTML = '';
  for (let i = 0; i <= 8; i++) {
    const { start:ws, end:we } = getWeekRangeWithOffset(now, -i);
    const wsKey = businessDayKey(ws);
    const weKey = businessDayKey(new Date(we.getTime() - 1));
    const label = (i === 0 ? '今週: ' : i + '週前: ') + businessDayLabelShortFromKey(wsKey) + '〜' + businessDayLabelShortFromKey(weKey);
    const opt = document.createElement('option');
    opt.value = -i;
    opt.textContent = label;
    sel.appendChild(opt);
  }
  document.getElementById('mail-modal').style.display = 'block';
}
function closeMailModal() {
  document.getElementById('mail-modal').style.display = 'none';
}
function sendMailWithOffset() {
  const offset = parseInt(document.getElementById('mail-week-select').value);
  closeMailModal();
  sendMail(offset);
}
function sendMail(offset = 0) {
  const now = new Date();
  const { start:ws, end:we } = getWeekRangeWithOffset(now, offset);
  const weekRecs = records.filter(r => r.start>=ws&&r.start<=we);
  if (weekRecs.length===0) { alert('この週の記録がありません'); return; }
  const byV={};
  weekRecs.forEach(r=>{byV[r.vendor]=(byV[r.vendor]||0)+r.duration;});
  const weekTotal=Object.values(byV).reduce((s,v)=>s+v,0);
  const wsKey = businessDayKey(ws);
  const weKey = businessDayKey(new Date(we.getTime() - 1));
  const subj=encodeURIComponent('デリログ｜稼働記録 '+businessDayLabelShortFromKey(wsKey)+'〜'+businessDayLabelShortFromKey(weKey));
  let body='【デリログ｜稼働記録】\n'+businessDayLabelShortFromKey(wsKey)+' 〜 '+businessDayLabelShortFromKey(weKey)+'（4:00締め）\n\n【業者別合計】\n';
  Object.keys(V).forEach(v=>{if(byV[v])body+=V[v].name+': '+fmt(byV[v])+'\n';});
  body+='─────────\n合計: '+fmt(weekTotal)+' / '+cfg.weekMax+':00\n\n【日別明細】\n';
  const byDay={};
  weekRecs.forEach(r=>{
    const dk=businessDayKey(r.start);
    if(!byDay[dk])byDay[dk]={key:dk,items:[]};
    byDay[dk].items.push(r);
  });
  Object.values(byDay).sort((a,b)=> (a.key>b.key?1:-1)).forEach(day=>{
    const dayByV={};
    day.items.forEach(r=>{dayByV[r.vendor]=(dayByV[r.vendor]||0)+r.duration;});
    const daySec=Object.values(dayByV).reduce((s,v)=>s+v,0);
    body+='\n'+businessDayLabelShortFromKey(day.key)+'\n';
    Object.keys(V).forEach(v=>{if(dayByV[v])body+='  '+V[v].name+': '+fmt(dayByV[v])+'\n';});
    body+='  ─ 合計: '+fmt(daySec)+'\n';
    day.items.forEach(r=>{body+='  ('+V[r.vendor].name+' '+tStr(r.start)+'〜'+tStr(r.end)+')'+(r.manual?' [手動]':'')+'\n';});
  });
  window.location.href='mailto:'+(cfg.mailTo||'')+'?subject='+subj+'&body='+encodeURIComponent(body);
}

function recordItem(r) {
  const idx = records.indexOf(r);
  const tags=(r.manual?'<span class="manual-tag">手動</span>':'')+(r.synced?'<span class="gas-tag">GAS</span>':'')+(r.pending?'<span class="manual-tag">送信中</span>':'');
  return `<div class="hitem">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="hdot" style="background:${V[r.vendor].color}"></div>
      <div>
        <div class="hvendor">${V[r.vendor].name}${tags}</div>
        <div class="hrange">${tStr(r.start)} → ${tStr(r.end)}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
      <div class="hdur">${fmtFull(r.duration)}</div>
      <button class="edit-btn" onclick="openModal(${idx})">編集</button>
      <button class="del-btn" onclick="deleteRecord(${idx})">✕</button>
    </div>
  </div>`;
}

function render() {

  const todayKey = businessDayKey(now);

  const todayRecs=records.filter(r=>businessDayKey(r.start)===todayKey);
  const activeIsToday = active && activeStart && businessDayKey(activeStart)===todayKey;
  const todaySec=todayRecs.reduce((s,r)=>s+r.duration,0)+(activeIsToday?elapsed:0);
  const byV={};
  todayRecs.forEach(r=>{byV[r.vendor]=(byV[r.vendor]||0)+r.duration;});
  if(activeIsToday)byV[active]=(byV[active]||0)+elapsed;
  document.getElementById('today-val').textContent=fmt(todaySec);
  const parts=Object.keys(byV).filter(v=>byV[v]>0).map(v=>V[v].name.replace('Uber Eats','Uber')+' '+fmt(byV[v]));

  const todayEarnTotal = uberY + demaeY + rocketDel + rocketQuest;
  const hourly = todaySec > 0 ? Math.round(todayEarnTotal / (todaySec / 3600)) : 0;
  if (!document.activeElement || !document.activeElement.closest('#today-earnings')) {
  document.getElementById('today-earnings').innerHTML = `

      </span>

        value="${moneyInputValue(demaeY)}"
        onfocus="this.select()"
        oninput="setEarning('${todayKey}','demae',null,this.value)">
      <span style="color:#888;font-size:11px;">円</span>
    </div>
    <div class="week-vendor-row" style="gap:10px;align-items:center;">
      <span style="display:flex;align-items:center;gap:6px;min-width:110px;">
        <span style="width:8px;height:8px;border-radius:50%;background:${V.rocket.color};display:inline-block;"></span>
        <span>${V.rocket.name}</span>
      </span>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="text" inputmode="numeric" pattern="[0-9]*" style="width:82px;text-align:right;"
          value="${moneyInputValue(rocketDel)}"
          onfocus="this.select()"

        <span style="color:#888;font-size:10px;">配達</span>

          value="${moneyInputValue(rocketQuest)}"
          onfocus="this.select()"

      </div>
    </div>
    <div class="week-total-row" style="border-top:1px solid #eee;">
      <span>合計売上 / 時給</span>
      <span>${money(todayEarnTotal)} / ${todaySec>0?money(hourly)+'/h':'-'}</span>
    </div>
  `;
  } // end focus guard

  const {start:ws,end:we}=getWeekRange(now);
  const weekRecs=records.filter(r=>r.start>=ws&&r.start<=we);
  const weekSec=weekRecs.reduce((s,r)=>s+r.duration,0)+(active&&activeStart>=ws?elapsed:0);
  const maxSec=cfg.weekMax*3600;

  document.getElementById('week-sub').textContent='今週 '+fmt(weekSec)+' / '+cfg.weekMax+'h使用';

  document.getElementById('week-range-label').textContent=wrl;
  const { start:ws2, end:we2 } = getWeekRangeWithOffset(now, weekOffset);
  const wrl2=dateStr(ws2)+' 〜 '+dateStr(we2);
